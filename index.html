<!DOCTYPE html>
<html>
<head>
  <title>IMP SMM Panel</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    .box {
      background: #222;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 200px;
    }

    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🔥 IMP SMM PANEL</h1>
<p>Fast | Cheap | Trusted Services</p>

<hr>

<!-- TIKTOK FOLLOWERS -->
<div class="box">
  <h2>📱 TikTok Followers</h2>
  <p>Price: Rs 500 / 1000</p>
  <input id="q1" placeholder="Quantity">
  <button onclick="order('TikTok Followers',500,'q1')">Order</button>
</div>

<!-- TIKTOK LIKES -->
<div class="box">
  <h2>❤️ TikTok Likes</h2>
  <p>Price: Rs 200 / 1000</p>
  <input id="q2" placeholder="Quantity">
  <button onclick="order('TikTok Likes',200,'q2')">Order</button>
</div>

<!-- INSTAGRAM FOLLOWERS -->
<div class="box">
  <h2>📸 Instagram Followers</h2>
  <p>Price: Rs 700 / 1000</p>
  <input id="q3" placeholder="Quantity">
  <button onclick="order('Instagram Followers',700,'q3')">Order</button>
</div>

<script>

function order(service, price, qtyId){

  let qty = document.getElementById(qtyId).value;

  if(!qty){
    alert("Quantity enter karo");
    return;
  }

  let total = (price * qty) / 1000;

  let msg =
  "🔥 NEW ORDER\n" +
  "Service: " + service + "\n" +
  "Quantity: " + qty + "\n" +
  "Total: Rs " + total;

  window.location.href =
  "https://wa.me/923451747872?text=" + encodeURIComponent(msg);
}

</script>

</body>
</html>

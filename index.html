/* ===== BASIC ===== */
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  overflow-x:hidden;
}

/* ===== NEON BACKGROUND ===== */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at top, #0ff, transparent 40%),
              radial-gradient(circle at bottom, #f0f, transparent 40%),
              radial-gradient(circle at center, #00ff99, transparent 40%);
  filter: blur(80px);
  opacity:0.3;
  animation: move 8s infinite alternate;
}

@keyframes move{
  0%{transform:translateY(0px)}
  100%{transform:translateY(40px)}
}

/* ===== GLASS BOX ===== */
.container{

.card{

  width:80%;
  max-width:500px;
  padding:30px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
}

/* ===== TITLE NEON ===== */
h1{
  font-size:40px;
  text-shadow: 0 0 10px #0ff, 0 0 20px #f0f;
}

/* ===== BUTTON ===== */
button{
  padding:15px 25px;
  margin-top:20px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#0ff,#f0f);
  color:black;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #0ff;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 40px #f0f;
}

/* ===== SERVICE BOX ===== */
.service{
  margin-top:30px;
  padding:15px;
  background:rgba(255,255,255,0.08);
  border-radius:15px;
}
</style>
</head>

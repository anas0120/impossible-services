<!DOCTYPE html>
<html>
<head>
  <title>Impossible SMM Panel</title>

  <style>
    body { font-family: Arial; background:#111; color:white; text-align:center; }
    .box { background:#222; margin:10px; padding:15px; border-radius:10px; }
    input { padding:10px; margin:5px; width:200px; }
    button { padding:10px; background:green; color:white; border:none; cursor:pointer; }
  </style>
</head>

<body>

<h1>🔥 Impossible SMM Panel</h1>
<p>Fast | Cheap | Trusted Services</p>

<hr>

<!-- TIKTOK FOLLOWERS -->
<div class="box">
  <h2>📱 TikTok Followers</h2>
  <p>Service ID: 101</p>
  <p>Base Price: Rs 500 / 1000</p>

  <input id="q1" placeholder="Quantity">
  <button onclick="order('TikTok Followers',500,101,'q1')">Order</button>
</div>

<!-- TIKTOK LIKES -->
<div class="box">
  <h2>❤️ TikTok Likes</h2>
  <p>Service ID: 102</p>
  <p>Base Price: Rs 200 / 1000</p>

  <input id="q2" placeholder="Quantity">
  <button onclick="order('TikTok Likes',200,102,'q2')">Order</button>
</div>

<!-- INSTAGRAM FOLLOWERS -->
<div class="box">
  <h2>📸 Instagram Followers</h2>
  <p>Service ID: 201</p>
  <p>Base Price: Rs 700 / 1000</p>

  <input id="q3" placeholder="Quantity">
  <button onclick="order('Instagram Followers',700,201,'q3')">Order</button>
</div>

<script>

function order(service, price, serviceId, qtyId){

  let qty = document.getElementById(qtyId).value;

  if(!qty){
    alert("Quantity enter karo");
    return;
  }

  // 💰 40% margin system
  let finalPrice = Math.round(price * 1.4);
  let total = (finalPrice * qty) / 1000;

  let msg =
  "🔥 NEW ORDER\n" +
  "Service: " + service + "\n" +
  "Service ID: " + serviceId + "\n" +
  "Quantity: " + qty + "\n" +
  "Price/1000: " + finalPrice + "\n" +
  "Total: Rs " + total;

  window.location.href =
  "https://wa.me/923451747872?text=" + encodeURIComponent(msg);
}

</script>

</body>
</html>
